name: Commit identity

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit uses the maintainer identity
        run: sh scripts/check-commit-identity.sh "${{ github.event.pull_request.head.sha || github.sha }}"
